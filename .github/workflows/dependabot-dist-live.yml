name: Live test - Dependabot dist rebuild

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'fixtures/dist-rebuild/**'
      - '.github/workflows/dependabot-dist-live.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-dist-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: v-chiranjib-swain/reusable-workflows/.github/workflows/dependabot-rebuild-dist.yml@368bd1faa6ed817126259e3341a8a8118069ab54
    with:
      node-version: '24.x'
      dist-path: fixtures/dist-rebuild/dist
      install-command: npm ci --ignore-scripts --prefix fixtures/dist-rebuild
      build-command: npm run build --prefix fixtures/dist-rebuild
    secrets:
      token: ${{ secrets.DEPENDABOT_BUILD_TOKEN }}
