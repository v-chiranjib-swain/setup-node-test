name: Live test - Concurrent PR update

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'fixtures/dist-concurrency/**'
      - '.github/workflows/dist-concurrency-live.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dist-concurrency-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: v-chiranjib-swain/reusable-workflows/.github/workflows/dependabot-rebuild-dist.yml@368bd1faa6ed817126259e3341a8a8118069ab54
    with:
      node-version: '24.x'
      dist-path: fixtures/dist-concurrency/dist
      install-command: npm ci --ignore-scripts --prefix fixtures/dist-concurrency
      build-command: |
        echo "Live concurrency test: delaying build for 300 seconds"
        sleep 300
        npm run build --prefix fixtures/dist-concurrency
    secrets:
      token: ${{ secrets.DEPENDABOT_BUILD_TOKEN }}
