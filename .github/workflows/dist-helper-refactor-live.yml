name: Live test - Extracted helpers

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'fixtures/dist-helper-refactor/**'
      - '.github/workflows/dist-helper-refactor-live.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dist-helper-refactor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: actions/reusable-workflows/.github/workflows/dependabot-rebuild-dist.yml@4e635c35f2acd242b529fbb3f980d7cb6c779384
    with:
      dist-path: fixtures/dist-helper-refactor/dist
      install-command: npm ci --ignore-scripts --prefix fixtures/dist-helper-refactor
      build-command: npm run build --prefix fixtures/dist-helper-refactor
    secrets:
      token: ${{ secrets.DEPENDABOT_BUILD_TOKEN }}
