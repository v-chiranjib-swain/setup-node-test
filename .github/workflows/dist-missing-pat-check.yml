name: Live test - Validate missing PAT fixture

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'fixtures/dist-missing-pat/**'
      - '.github/workflows/dist-missing-pat-check.yml'

permissions:
  contents: read

jobs:
  check-fixture:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefix fixtures/dist-missing-pat
      - name: Build generated output
        run: npm run build --prefix fixtures/dist-missing-pat
      - name: Confirm dependency update changes generated output
        run: |
          if git diff --quiet -- fixtures/dist-missing-pat/dist; then
            echo "::error::The dependency update did not change generated output."
            exit 1
          fi
