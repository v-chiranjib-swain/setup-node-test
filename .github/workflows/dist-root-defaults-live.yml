name: Live test - Root defaults

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'dist/**'
      - 'fixtures/dist-root-defaults/**'
      - '.github/workflows/dist-root-defaults-live.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dist-root-defaults-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: v-chiranjib-swain/reusable-workflows/.github/workflows/dependabot-rebuild-dist.yml@368bd1faa6ed817126259e3341a8a8118069ab54
    secrets:
      token: ${{ secrets.DEPENDABOT_BUILD_TOKEN }}
