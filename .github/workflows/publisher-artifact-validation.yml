name: Publisher artifact validation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/publisher-artifact-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malformed-and-corrupt-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned publisher and regression harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: v-chiranjib-swain/reusable-workflows
          ref: 368bd1faa6ed817126259e3341a8a8118069ab54
          path: publisher-tests
          persist-credentials: false

      - name: Reject malformed ZIP and CRC-corrupted payload
        working-directory: publisher-tests/tests
        run: |
          python3 -B -m unittest -v \
            test_dependabot_rebuild_dist.WorkflowTests.test_malformed_and_corrupt_archives

      - name: Reject unsafe archive paths and file types
        working-directory: publisher-tests/tests
        run: |
          python3 -B -m unittest -v \
            test_dependabot_rebuild_dist.WorkflowTests.test_unsafe_archive_entries

      - name: Reject duplicate entries and file-directory conflicts
        working-directory: publisher-tests/tests
        run: |
          python3 -B -m unittest -v \
            test_dependabot_rebuild_dist.WorkflowTests.test_duplicates_and_file_directory_conflicts

      - name: Reject archives exceeding resource limits
        working-directory: publisher-tests/tests
        run: |
          python3 -B -m unittest -v \
            test_dependabot_rebuild_dist.WorkflowTests.test_archive_resource_limits

      - name: Reject encrypted entries and unsupported compression
        working-directory: publisher-tests/tests
        run: |
          python3 -B -m unittest -v \
            test_dependabot_rebuild_dist.WorkflowTests.test_encrypted_and_unsupported_compression_are_rejected

      - name: Reject NUL-truncated ZIP filenames
        working-directory: publisher-tests/tests
        run: |
          python3 -B -m unittest -v \
            test_dependabot_rebuild_dist.WorkflowTests.test_nul_truncated_zip_names_are_rejected

      - name: Record verified boundary
        run: |
          {
            echo '### Publisher artifact validation passed'
            echo '- A non-ZIP artifact was rejected with the expected diagnostic.'
            echo '- A ZIP with a corrupted payload was rejected by CRC validation.'
            echo '- Both rejections preserved the temporary local remote branch.'
            echo '- Ten unsafe-entry cases were rejected: traversal, absolute paths, backslashes, control characters, .git paths, out-of-root entries, symlinks, FIFOs, and mismatched directory types.'
            echo '- Every unsafe-entry rejection preserved the local remote branch and existing generated bundle.'
            echo '- Three archive conflicts were rejected: duplicate files, a file used as a parent directory, and a shared file/directory path.'
            echo '- Every archive-conflict rejection preserved the temporary local remote branch.'
            echo '- A sparse local file sized 128 MiB plus one byte was rejected by the compressed-size guard.'
            echo '- Mocked ZIP metadata exceeding 20000 entries or 512 MiB decompressed size was rejected by the corresponding guards.'
            echo '- All three resource-limit rejections preserved the temporary local remote branch; this was not a large-artifact download or extraction test.'
            echo '- Mocked ZIP metadata with the encryption flag or LZMA compression was rejected with the expected diagnostic.'
            echo '- Both encryption/compression guard rejections preserved the temporary local remote branch; actual encrypted payloads were not used.'
            echo '- Mocked ZIP metadata with a NUL-truncated filename was rejected with the unsafe-path diagnostic.'
            echo '- The NUL-filename rejection preserved the temporary local remote branch; no crafted ZIP bytes were used.'
            echo '- The harness executed the actual pinned inline publisher script.'
            echo '- API responses were mocked; only dummy credentials and a local Git remote were used.'
            echo '- No repository publishing secret was mapped, and job permissions were read-only.'
          } >> "$GITHUB_STEP_SUMMARY"
